# Render.com Deployment Configuration
# https://render.com/docs/yaml-spec

services:
  # Backend API (FastAPI)
  - type: web
    name: tradescope-backend
    runtime: python
    region: frankfurt  # EU region
    plan: starter  # $7/month
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DATABASE_URL
        fromDatabase:
          name: tradescope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tradescope-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://tradescope-frontend.onrender.com
      - key: DEBUG
        value: false
    
  # Frontend (Next.js)
  - type: web
    name: tradescope-frontend
    runtime: node
    region: frankfurt
    plan: starter  # $7/month
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tradescope-backend.onrender.com
      - key: NODE_ENV
        value: production

databases:
  # PostgreSQL Database
  - name: tradescope-db
    databaseName: tradescope
    plan: starter  # Free tier available
    region: frankfurt
    ipAllowList: []  # Allow all (or restrict to specific IPs)

# Redis (optional - for Celery)
# Uncomment when you need background tasks
# - type: redis
#   name: tradescope-redis
