[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://tradescope-backend.fly.dev"
  NEXT_PUBLIC_APP_NAME = "TradeScope"
  NODE_VERSION = "18"

[context.production]
  environment = { NODE_ENV = "production" }
